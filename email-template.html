<div style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: auto; border: 1px solid #e0e0e0; border-top: 4px solid #002B56; border-radius: 8px; overflow: hidden;">
    
    <div style="background-color: #f8f9fa; padding: 20px; border-bottom: 1px solid #e0e0e0; text-align: center;">
        <h2 style="margin: 0; color: #002B56; font-size: 22px; letter-spacing: 0.5px;">🚀 New Service Inquiry</h2>
        <p style="margin: 5px 0 0; color: #666; font-size: 14px;">Inbound lead from Rienne Digital Solutions</p>
    </div>

    <div style="padding: 25px;">
        <div style="margin-bottom: 20px;">
            <table style="width: 100%; border-spacing: 0;">
                <tr>
                    <td style="padding: 10px 0; font-weight: bold; color: #555; width: 40%; border-bottom: 1px solid #eee;">Client Name</td>
                    <td style="padding: 10px 0; color: #222; border-bottom: 1px solid #eee;">{{name}}</td>
                </tr>
                <tr>
                    <td style="padding: 10px 0; font-weight: bold; color: #555; border-bottom: 1px solid #eee;">Email Address</td>
                    <td style="padding: 10px 0; border-bottom: 1px solid #eee;">
                        <a href="mailto:{{email}}" style="color: #4f46e5; text-decoration: none;">{{email}}</a>
                    </td>
                </tr>
                <tr>
                    <td style="padding: 10px 0; font-weight: bold; color: #555; border-bottom: 1px solid #eee;">Service Interest</td>
                    <td style="padding: 10px 0; border-bottom: 1px solid #eee;">
                        <span style="background-color: #002B56; color: #ffffff; padding: 4px 10px; border-radius: 15px; font-size: 11px; font-weight: bold;">{{service_interest}}</span>
                    </td>
                </tr>
            </table>
        </div>

        <div style="background-color: #fcfcfc; border: 1px solid #f0f0f0; border-radius: 6px; padding: 20px;">
            <h4 style="margin: 0 0 10px; color: #333; font-size: 16px;">Client Message:</h4>
            <p style="margin: 0; color: #555; font-style: italic; font-size: 15px; line-height: 1.8;">
                "{{message}}"
            </p>
        </div>
    </div>

    <div style="background-color: #f8f9fa; padding: 15px; text-align: center; border-top: 1px solid #e0e0e0;">
        <p style="margin: 0; font-size: 11px; color: #999;">
            Captured by your secure portfolio portal.<br>
            Sent via Rienne Systems Protocol
        </p>
    </div>
</div>
